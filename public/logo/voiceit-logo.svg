<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#534ab7"/>
  
  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#c5c0ff" stroke-width="1.5" opacity="0.3"/>

  <!-- Speech bubble body -->
  <rect x="36" y="44" width="128" height="90" rx="20" fill="white"/>
  
  <!-- Speech bubble tail -->
  <path d="M60 134 L48 158 L84 134 Z" fill="white"/>
  
  <!-- Sound wave lines inside bubble — representing "voice" -->
  <!-- Left wave -->
  <path d="M64 89 Q64 72 72 72 Q80 72 80 89 Q80 106 72 106 Q64 106 64 89Z" fill="#534ab7" opacity="0.15"/>
  <path d="M68 89 C68 78 76 78 76 89 C76 100 68 100 68 89Z" fill="#534ab7"/>
  
  <!-- Center wave (mic / voice icon) -->
  <rect x="93" y="65" width="14" height="36" rx="7" fill="#534ab7"/>
  <path d="M84 94 C84 107 116 107 116 94" stroke="#534ab7" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <line x1="100" y1="107" x2="100" y2="116" stroke="#534ab7" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="92" y1="116" x2="108" y2="116" stroke="#534ab7" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right wave -->
  <path d="M122 78 C130 78 136 82 136 89 C136 96 130 100 122 100" stroke="#534ab7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M122 68 C137 68 148 77 148 89 C148 101 137 110 122 110" stroke="#534ab7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.25"/>
</svg>
