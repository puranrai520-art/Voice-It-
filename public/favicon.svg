<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Icon-only version: speech bubble with mic -->
  <circle cx="24" cy="24" r="24" fill="#534ab7"/>
  <!-- Bubble -->
  <rect x="8" y="8" width="32" height="26" rx="8" fill="white"/>
  <!-- Tail -->
  <path d="M12 34 L10 42 L22 34 Z" fill="white"/>
  <!-- Mic capsule -->
  <rect x="21" y="13" width="6" height="14" rx="3" fill="#534ab7"/>
  <!-- Mic arc -->
  <path d="M17 23 C17 29 31 29 31 23" stroke="#534ab7" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Mic stand -->
  <line x1="24" y1="29" x2="24" y2="32" stroke="#534ab7" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="28" y2="32" stroke="#534ab7" stroke-width="2" stroke-linecap="round"/>
</svg>
